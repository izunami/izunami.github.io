<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>StudentExam v2.0 — API Diagnostic</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f4f6f9;
            color: #212529;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #6c757d;
            margin-bottom: 25px;
        }


        /* =====================================================
         * CARD
         * =================================================== */

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, .08);
        }


        /* =====================================================
         * BUTTON
         * =================================================== */

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            background: #0d6efd;
            color: #fff;
            font-size: 14px;
        }

        button:hover {
            opacity: .9;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        button.danger {
            background: #dc3545;
        }

        button.success {
            background: #198754;
        }

        button.warning {
            background: #ffc107;
            color: #212529;
        }

        button.secondary {
            background: #6c757d;
        }


        /* =====================================================
         * INPUT
         * =================================================== */

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input {
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            min-width: 180px;
        }


        /* =====================================================
         * STATUS
         * =================================================== */

        .status {
            padding: 12px 15px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status.idle {
            background: #e9ecef;
            color: #495057;
        }

        .status.running {
            background: #cff4fc;
            color: #055160;
        }

        .status.success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status.warning {
            background: #fff3cd;
            color: #664d03;
        }

        .status.error {
            background: #f8d7da;
            color: #842029;
        }


        /* =====================================================
         * LATENCY
         * =================================================== */

        .latency {
            font-weight: bold;
        }

        .latency.fast {
            color: #198754;
        }

        .latency.medium {
            color: #d39e00;
        }

        .latency.slow {
            color: #dc3545;
        }


        /* =====================================================
         * RESULT TABLE
         * =================================================== */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f8f9fa;
        }


        /* =====================================================
         * BADGE
         * =================================================== */

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .badge-warning {
            background: #fff3cd;
            color: #664d03;
        }

        .badge-danger {
            background: #f8d7da;
            color: #842029;
        }

        .badge-secondary {
            background: #e9ecef;
            color: #495057;
        }


        /* =====================================================
         * OUTPUT
         * =================================================== */

        pre {
            margin: 0;
            padding: 16px;
            background: #212529;
            color: #f8f9fa;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
            min-height: 120px;
        }


        /* =====================================================
         * SUMMARY
         * =================================================== */

        .summary-grid {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 12px;
        }

        .summary-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .summary-value {
            display: block;
            font-size: 25px;
            font-weight: bold;
            margin-top: 5px;
        }


        @media (max-width: 700px) {

            .summary-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

    </style>

</head>

<!-- =========================================================

     ========================================================= -->

<script type="module">


/* =========================================================
 * IMPORT
 * ======================================================= */

import {
    CONFIG,
    getApiUrl,
    getApiActionUrl
}
from "./assets/js/config.js";


import {
    Utils
}
from "./assets/js/utils.js";


/* =========================================================
 * DOM
 * ======================================================= */

const output =
    document.getElementById(
        "output"
    );


const globalStatus =
    document.getElementById(
        "globalStatus"
    );


const historyBody =
    document.getElementById(
        "historyBody"
    );


/* =========================================================
 * STATE
 * ======================================================= */

const state = {

    history: [],

    total: 0,

    success: 0,

    error: 0,

    totalLatency: 0

};


/* =========================================================
 * HELPERS
 * ======================================================= */

function show(data) {

    output.textContent =
        typeof data === "string"
            ? data
            : JSON.stringify(
                data,
                null,
                2
            );

}


function setStatus(
    message,
    type = "idle"
) {

    globalStatus.className =
        "status " + type;

    globalStatus.textContent =
        message;

}


function formatLatency(
    ms
) {

    return (
        Math.round(ms) +
        " ms"
    );

}


function latencyClass(
    ms
) {

    if (ms < 1000) {

        return "fast";

    }

    if (ms < 3000) {

        return "medium";

    }

    return "slow";

}


function formatTime(
    date = new Date()
) {

    return date.toLocaleTimeString(
        "vi-VN"
    );

}


/* =========================================================
 * SUMMARY
 * ======================================================= */

function updateSummary() {

    document.getElementById(
        "summaryTotal"
    ).textContent =
        state.total;


    document.getElementById(
        "summarySuccess"
    ).textContent =
        state.success;


    document.getElementById(
        "summaryError"
    ).textContent =
        state.error;


    const average =
        state.total > 0
            ? state.totalLatency /
              state.total
            : 0;


    document.getElementById(
        "summaryLatency"
    ).textContent =
        Math.round(
            average
        ) +
        " ms";

}


/* =========================================================
 * HISTORY
 * ======================================================= */

function addHistory(
    api,
    method,
    latency,
    success,
    message
) {

    const item = {

        api,

        method,

        latency,

        success,

        message,

        time:
            new Date()

    };


    state.history.unshift(
        item
    );


    state.total++;


    state.totalLatency +=
        latency;


    if (success) {

        state.success++;

    } else {

        state.error++;

    }


    renderHistory();

    updateSummary();

}


function renderHistory() {

    historyBody.innerHTML = "";


    state.history
        .forEach(
            function(
                item,
                index
            ) {

                const tr =
                    document.createElement(
                        "tr"
                    );


                const latencyCls =
                    latencyClass(
                        item.latency
                    );


                const statusBadge =
                    item.success
                        ? `
                            <span class="badge badge-success">
                                PASS
                            </span>
                          `
                        : `
                            <span class="badge badge-danger">
                                ERROR
                            </span>
                          `;


                tr.innerHTML = `

                    <td>
                        ${state.history.length - index}
                    </td>

                    <td>
                        <strong>
                            ${item.api}
                        </strong>
                    </td>

                    <td>
                        ${item.method}
                    </td>

                    <td>
                        <span class="latency ${latencyCls}">
                            ${formatLatency(item.latency)}
                        </span>
                    </td>

                    <td>
                        ${statusBadge}
                    </td>

                    <td>
                        ${formatTime(item.time)}
                    </td>

                `;


                historyBody.appendChild(
                    tr
                );

            }
        );

}


/* =========================================================
 * TOKEN
 * ======================================================= */

function getToken() {

    return Utils.getToken();

}


/* =========================================================
 * GENERIC API TEST
 * ======================================================= */

/**
 * Chạy một API GET và đo latency.
 *
 * @param {string} label
 * @param {string} action
 * @param {Object} params
 */

async function testGet(
    label,
    action,
    params = {}
) {

    const start =
        performance.now();


    setStatus(
        `Đang gọi ${label}...`,
        "running"
    );


    show(
        `Đang gọi ${label}...`
    );


    try {

        const result =
            await Utils.apiGet(
                action,
                params
            );


        const latency =
            performance.now() -
            start;


        const success =
            !!(
                result &&
                result.success === true
            );


        addHistory(
            label,
            "GET",
            latency,
            success,
            result?.message || ""
        );


        show(result);


        if (success) {

            setStatus(
                `${label} — PASS — ${formatLatency(latency)}`,
                latency > 3000
                    ? "warning"
                    : "success"
            );

        } else {

            setStatus(
                `${label} — API ERROR — ${formatLatency(latency)}`,
                "error"
            );

        }


        return result;

    } catch (error) {

        const latency =
            performance.now() -
            start;


        addHistory(
            label,
            "GET",
            latency,
            false,
            error.message
        );


        show({

            error:
                error.message,

            latency:
                formatLatency(
                    latency
                )

        });


        setStatus(
            `${label} — ERROR — ${error.message} — ${formatLatency(latency)}`,
            "error"
        );


        throw error;

    }

}


/* =========================================================
 * TEST CONFIG
 * ======================================================= */

document
    .getElementById(
        "btnConfig"
    )
    .onclick =
    function() {

        try {

            const data = {

                BASE_URL:
                    CONFIG.API.BASE_URL,

                TIMEOUT:
                    CONFIG.API.TIMEOUT,

                ACTION:
                    CONFIG.API.ACTION,

                API_URL:
                    getApiUrl(),

                LOGIN_URL:
                    getApiActionUrl(
                        CONFIG.API.ACTION.LOGIN
                    )

            };


            show(data);


            setStatus(
                "CONFIG — PASS",
                "success"
            );

        } catch (error) {

            show({
                error:
                    error.message
            });

            setStatus(
                "CONFIG — ERROR",
                "error"
            );

        }

    };


/* =========================================================
 * PING
 * ======================================================= */

document
    .getElementById(
        "btnPing"
    )
    .onclick =
    async function() {

        const action =
            CONFIG.API.ACTION.PING ||
            "ping";


        await testGet(
            "PING",
            action
        );

    };


/* =========================================================
 * LOGIN
 * ======================================================= */

document
    .getElementById(
        "btnLogin"
    )
    .onclick =
    async function() {

        try {

            const result =
                await testGet(
                    "LOGIN HS001",
                    CONFIG.API.ACTION.LOGIN,
                    {
                        studentId:
                            "HS001"
                    }
                );


            if (
                result &&
                result.success &&
                result.data
            ) {

                const data =
                    result.data;


                const token =
                    data.loginKey ||
                    data.token ||
                    "";


                if (!token) {

                    throw new Error(
                        "API không trả về Login Key."
                    );

                }


                Utils.setSession({

                    token,

                    loginKey:
                        token,

                    student:
                        data.student ||
                        null

                });


                setStatus(
                    "LOGIN HS001 — PASS — session đã lưu.",
                    "success"
                );

            }

        } catch (error) {

            console.error(
                "LOGIN:",
                error
            );

        }

    };


/* =========================================================
 * CHECK SESSION
 * ======================================================= */

document
    .getElementById(
        "btnSession"
    )
    .onclick =
    async function() {

        const token =
            getToken();


        if (!token) {

            show(
                "Chưa có session token. Hãy Login HS001 trước."
            );

            setStatus(
                "CHECK SESSION — thiếu token.",
                "warning"
            );

            return;

        }


        await testGet(
            "CHECK SESSION",
            CONFIG.API.ACTION.CHECK_SESSION,
            {
                token
            }
        );

    };


/* =========================================================
 * GET CLASSES
 * ======================================================= */

document
    .getElementById(
        "btnClasses"
    )
    .onclick =
    async function() {

        const token =
            getToken();


        if (!token) {

            show(
                "Chưa có token. Hãy Login HS001 trước."
            );

            setStatus(
                "GET CLASSES — thiếu token.",
                "warning"
            );

            return;

        }


        await testGet(
            "GET CLASSES",
            CONFIG.API.ACTION.GET_CLASSES,
            {
                token
            }
        );

    };


/* =========================================================
 * GET STUDENTS
 * ======================================================= */

document
    .getElementById(
        "btnStudents"
    )
    .onclick =
    async function() {

        const token =
            getToken();


        if (!token) {

            show(
                "Chưa có token. Hãy Login HS001 trước."
            );

            setStatus(
                "GET STUDENTS — thiếu token.",
                "warning"
            );

            return;

        }


        await testGet(
            "GET STUDENTS",
            CONFIG.API.ACTION.GET_STUDENTS,
            {
                token
            }
        );

    };


/* =========================================================
 * GET EXAMS
 * ======================================================= */

document
    .getElementById(
        "btnExams"
    )
    .onclick =
    async function() {

        const token =
            getToken();


        if (!token) {

            show(
                "Chưa có token. Hãy Login HS001 trước."
            );

            setStatus(
                "GET EXAMS — thiếu token.",
                "warning"
            );

            return;

        }


        await testGet(
            "GET EXAMS",
            CONFIG.API.ACTION.GET_EXAMS,
            {
                token
            }
        );

    };


/* =========================================================
 * GET EXAM
 * ======================================================= */

async function runGetExam() {

    const token =
        getToken();


    if (!token) {

        show(
            "Chưa có token. Hãy Login HS001 trước."
        );

        setStatus(
            "GET EXAM — thiếu token.",
            "warning"
        );

        return;

    }


    const examId =
        document
            .getElementById(
                "examIdInput"
            )
            .value
            .trim();


    if (!examId) {

        show(
            "Vui lòng nhập examId."
        );

        setStatus(
            "GET EXAM — thiếu examId.",
            "warning"
        );

        return;

    }


    await testGet(
        `GET EXAM ${examId}`,
        CONFIG.API.ACTION.GET_EXAM,
        {
            token,

            examId
        }
    );

}


document
    .getElementById(
        "btnExam"
    )
    .onclick =
    runGetExam;


document
    .getElementById(
        "btnGetExam"
    )
    .onclick =
    runGetExam;


/* =========================================================
 * GET RESULTS
 * ======================================================= */

document
    .getElementById(
        "btnResults"
    )
    .onclick =
    async function() {

        const token =
            getToken();


        if (!token) {

            show(
                "Chưa có token. Hãy Login HS001 trước."
            );

            setStatus(
                "GET RESULTS — thiếu token.",
                "warning"
            );

            return;

        }


        await testGet(
            "GET RESULTS",
            CONFIG.API.ACTION.GET_RESULTS,
            {
                token
            }
        );

    };


/* =========================================================
 * LOGOUT
 * ======================================================= */

document
    .getElementById(
        "btnLogout"
    )
    .onclick =
    function() {

        try {

            Utils.logout();


            show({
                success:
                    true,

                message:
                    "Session local đã được xóa.",

                token:
                    Utils.getToken()

            });


            setStatus(
                "LOGOUT — PASS",
                "success"
            );

        } catch (error) {

            show({
                error:
                    error.message
            });

            setStatus(
                "LOGOUT — ERROR",
                "error"
            );

        }

    };


/* =========================================================
 * RUN FULL DIAGNOSTIC
 * ======================================================= */

document
    .getElementById(
        "btnRunDiagnostic"
    )
    .onclick =
    async function() {

        const button =
            this;


        button.disabled =
            true;


        setStatus(
            "Đang chạy Diagnostic...",
            "running"
        );


        try {

            /*
             * 1. PING
             */

            await testGet(
                "PING",
                CONFIG.API.ACTION.PING ||
                "ping"
            );


            /*
             * 2. LOGIN
             */

            const loginResult =
                await testGet(
                    "LOGIN HS001",
                    CONFIG.API.ACTION.LOGIN,
                    {
                        studentId:
                            "HS001"
                    }
                );


            if (
                loginResult &&
                loginResult.success &&
                loginResult.data
            ) {

                const data =
                    loginResult.data;


                const token =
                    data.loginKey ||
                    data.token ||
                    "";


                if (token) {

                    Utils.setSession({

                        token,

                        loginKey:
                            token,

                        student:
                            data.student ||
                            null

                    });

                }

            }


            const token =
                getToken();


            if (!token) {

                throw new Error(
                    "Không tạo được session sau LOGIN."
                );

            }


            /*
             * 3. CHECK SESSION
             */

            await testGet(
                "CHECK SESSION",
                CONFIG.API.ACTION.CHECK_SESSION,
                {
                    token
                }
            );


            /*
             * 4. GET CLASSES
             */

            await testGet(
                "GET CLASSES",
                CONFIG.API.ACTION.GET_CLASSES,
                {
                    token
                }
            );


            /*
             * 5. GET STUDENTS
             */

            await testGet(
                "GET STUDENTS",
                CONFIG.API.ACTION.GET_STUDENTS,
                {
                    token
                }
            );


            /*
             * 6. GET EXAMS
             */

            const exams =
                await testGet(
                    "GET EXAMS",
                    CONFIG.API.ACTION.GET_EXAMS,
                    {
                        token
                    }
                );


            /*
             * 7. GET EXAM
             */

            const examId =
                document
                    .getElementById(
                        "examIdInput"
                    )
                    .value
                    .trim();


            if (examId) {

                await testGet(
                    `GET EXAM ${examId}`,
                    CONFIG.API.ACTION.GET_EXAM,
                    {
                        token,

                        examId
                    }
                );

            }


            /*
             * 8. GET RESULTS
             */

            await testGet(
                "GET RESULTS",
                CONFIG.API.ACTION.GET_RESULTS,
                {
                    token
                }
            );


            setStatus(
                "Diagnostic hoàn tất.",
                "success"
            );


        } catch (error) {

            console.error(
                "DIAGNOSTIC:",
                error
            );


            setStatus(
                `Diagnostic dừng: ${error.message}`,
                "error"
            );

        } finally {

            button.disabled =
                false;

        }

    };


/* =========================================================
 * CLEAR HISTORY
 * ======================================================= */

document
    .getElementById(
        "btnClearHistory"
    )
    .onclick =
    function() {

        state.history =
            [];

        state.total =
            0;

        state.success =
            0;

        state.error =
            0;

        state.totalLatency =
            0;


        renderHistory();

        updateSummary();


        show(
            "Đã xóa lịch sử diagnostic."
        );


        setStatus(
            "Đã reset diagnostic.",
            "idle"
        );

    };
